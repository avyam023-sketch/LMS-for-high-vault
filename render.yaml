# One-click deploy on Render: the web app (Docker) plus a managed PostgreSQL database.
# Secrets are generated by Render or typed into Render's dashboard. Nothing secret is stored in this file.
# Render asks for every "sync: false" value when you create the blueprint; the optional ones can stay blank.
databases:
  - name: highvault-db
    plan: free
    databaseName: highvault
    user: highvault

services:
  - type: web
    name: high-vault-lms
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: highvault-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # Load the course on first boot, and create the first admin from these two values.
      - key: SEED_ON_START
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Fictional learners, exams and certificates so the admin has something to show.
      # Remove them from Admin → Overview, then set this to "false", before real learners sign up.
      - key: SEED_SAMPLE_DATA
        value: "true"
      # Email (resend.com → API keys). Blank: emails print to the Render log instead of being sent.
      - key: RESEND_API_KEY
        sync: false
      # Learners confirm their email before studying. Off for the demo so sign-up works before email is
      # set up; change to "true" once Resend is sending from your domain.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      # Payments (Stripe → Developers → API keys). An sk_test_ key takes test cards; no real money moves.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Chapter videos (Bunny Stream → library → Security → Token authentication key).
      - key: BUNNY_STREAM_TOKEN_KEY
        sync: false
      - key: SUPPORT_EMAIL
        value: info@thehighvaultsecurity.ca
      - key: MAIL_FROM
        value: The High Vault Security <no-reply@thehighvaultsecurity.ca>
