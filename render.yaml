# One-click deploy on Render: the web app (Docker) plus a managed PostgreSQL database.
# Secrets are generated by Render at creation time — nothing secret is stored in this file.
databases:
  - name: highvault-db
    plan: free
    databaseName: highvault
    user: highvault

services:
  - type: web
    name: high-vault-lms
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: highvault-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_ON_START
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_URL
        sync: false
      - key: SUPPORT_EMAIL
        value: info@thehighvaultsecurity.ca
      - key: MAIL_FROM
        value: The High Vault Security <no-reply@thehighvaultsecurity.ca>
