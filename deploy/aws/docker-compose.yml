# Production on one AWS Lightsail instance (Montreal, ca-central-1):
#   Caddy (automatic HTTPS) → the app → a Lightsail managed PostgreSQL database.
# From the repository root:  docker compose -f deploy/aws/docker-compose.yml up -d --build
# Settings live in deploy/aws/.env (made by setup.sh). See deploy/aws/README.md.
services:
  app:
    build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      APP_URL: https://${DOMAIN:?Set DOMAIN in deploy/aws/.env}
      DATABASE_CA_FILE: /certs/global-bundle.pem
    volumes:
      - ./certs:/certs:ro
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
